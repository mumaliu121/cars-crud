name: Cars CRUD - Test and Publish

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Run application tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium browser for Playwright E2E
        run: playwright install --with-deps chromium

      # 第一阶段：运行单元、集成、API测试
      - name: Run unit + api + integration tests
        run: python -m pytest tests/unit tests/api tests/integration -q --junitxml=report-unit.xml

      # 第二阶段：单独调用e2e目录，触发e2e/conftest.py的pytest_addoption钩子，conftest文件保持原样不修改
      - name: Run E2E browser tests
        run: python -m pytest tests/e2e -q --junitxml=report-e2e.xml

      - name: Upload pytest report(always run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-junit-report
          path: |
            report-unit.xml
            report-e2e.xml
          retention-days: 7

      - name: Upload Playwright test‑results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fail-screenshots
          path: test-results/
          retention-days: 7

  publish:
    name: Build and publish Docker image
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cars-crud:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cars-crud:sha-${{ github.sha }}
